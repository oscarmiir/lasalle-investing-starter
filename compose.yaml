name: lasalle-investing-starter
services:
  etl:
    image: apache/spark:3.5.6
    user: "0:0"
    working_dir: /workspace
    environment:
      SPARK_LOCAL_IP: 127.0.0.1
      PYTHONPATH: /workspace
    volumes:
      - .:/workspace
    # Los argumentos de "docker compose run --rm etl ..." se pasan a etl_spark.py.
    entrypoint: ["/opt/spark/bin/spark-submit", "--master", "local[2]", "/workspace/etl_spark.py"]
    command: []
